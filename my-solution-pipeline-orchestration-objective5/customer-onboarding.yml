name: Customer Purchase Onboarding (Prod)

on:
  repository_dispatch:
    types: [customer-purchased]
  workflow_dispatch:
    inputs:
      company_id:
        description: 'Customer Company ID'
        required: true
        default: 'test-123'
      company_name:
        description: 'Customer Company Name'
        required: true
        default: 'Test Company'
      company_motto:
        description: 'Customer Motto'
        required: true
        default: 'Excellence in Scale'
      image_tag:
        description: 'Prod-approved image tag to deploy, e.g. v1.2.3. Must exist: the Provision step reads inputs.image_tag, so it must be defined here.'
        required: true
        default: 'v1.2.3'

jobs:
    onboard-tenant:
      runs-on: ubuntu-latest
      environment: production
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Resolve Dynamic Tenant Metadata
          id: meta
          run: |
            TENANT_ID="${{ github.event.client_payload.company_id || inputs.company_id }}"
            REGION="${{ github.event.client_payload.aws_region || inputs.aws_region || 'us-east-1' }}"
            TAG="${{ github.event.client_payload.image_tag || inputs.image_tag }}"
            IAM_ROLE="arn:aws:iam::333333333333:role/GitHubActionsProdRole-$REGION"

            echo "tenant_id=$TENANT_ID" >> $GITHUB_OUTPUT
            echo "aws_region=$REGION" >> $GITHUB_OUTPUT
            echo "image_tag=$TAG" >> $GITHUB_OUTPUT
            echo "iam_role=$IAM_ROLE" >> $GITHUB_OUTPUT
            echo "Targeting Tenant: $TENANT_ID in Region: $REGION with Tag: $TAG"

        - name: Authenticate with Production AWS Account
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: ${{ steps.meta.outputs.aws_region }}
            role-to-assume: ${{ steps.meta.outputs.IAM_ROLE}}

        - name: Pull and Push Artifact to Production ECR
          uses: ./my-solution-pipeline-orchestration-objective5/.github/actions/pull-artifact
          with:
            tag: ${{ inputs.image_tag }}
            artifactory_url: 'artifactory.internal/sas-product'
            artifactory_user: ${{ secrets.ARTIFACTORY_USER }}
            artifactory_token: ${{ secrets.ARTIFACTORY_TOKEN }}
            local_ecr_registry: '333333333333.dkr.ecr.us-east-1.amazonaws.com/sas-product-production'
            aws_region: ${{ steps.meta.outputs.aws_region}}

        - name: Provision customer namespace/infrastructure with Terraform
          run: |
            cd my-solution-infrastructure-as-code-objective9/terraform/environments/production
            terraform init
            terraform apply -auto-approve -target='module.customer["$TENANT_ID"]'
        
        - name: Provision or Update Tenant via Helm / Terraform
          id: deploy-tenant
          run: |
            TENANT_ID="${{ github.event.client_payload.company_id || inputs.company_id }}"
            COMP_NAME="${{ github.event.client_payload.company_name || inputs.company_name }}"
            COMP_MOTTO="${{ github.event.client_payload.company_motto || inputs.company_motto }}"
            IMAGE_TAG="${{ github.event.client_payload.image_tag || inputs.image_tag }}"

            echo "Deploying tenant $TENANT_ID ($COMP_NAME) with image tag: $IMAGE_TAG"

            helm upgrade --install customer-$TENANT_ID ./my-solution-pipeline-orchestration-objective5/helm/tenant-template \
            --namespace customer-$TENANT_ID \
            --set companyName="$COMP_NAME" \
            --set companyMotto="$COMP_MOTTO" \
            --set host="$TENANT_ID.sas-product.com" \
            --set image.tag="$IMAGE_TAG" \
            --timeout 5m
            echo "Tenant deployment completed successfully."

        - name: Run Production Tenant Smoke Test
          uses: ./my-solution-pipeline-orchestration-objective5/.github/actions/run-system-tests
          with:
            test_type: smoke 
            target_url: https://${{ github.event.client_payload.company_id || inputs.company_id }}.sas-product.com

        - name: Rollback Tenant on Failure
          if: failure()
          run: |
            TENANT_ID="${{ github.event.client_payload.company_id || inputs.company_id }}"
            RELEASE_NAME="customer-$TENANT_ID"
            NAMESPACE="customer-$TENANT_ID"
            echo "⚠️ Deployment or smoke test failed for $TENANT_ID. Evaluating rollback strategy..."

            # Check how many revisions exist for this Helm release
            REVISION_COUNT=$(helm history $RELEASE_NAME -n $NAMESPACE --output json 2>/dev/null | jq '. | length' || echo 0)

            if [ "$REVISION_COUNT" -gt 1 ]; then
              echo "🔄 Existing tenant update detected (Revisions: $REVISION_COUNT). Rolling back to last good revision..."
              helm rollback customer-$TENANT_ID -n customer-$TENANT_ID
              echo "✅ Successfully rolled back $RELEASE_NAME to previous working state."
            else
              echo "🧹 Brand-new tenant deployment detected (Revisions: $REVISION_COUNT). Performing complete tear-down..."
              helm uninstall $RELEASE_NAME -n $NAMESPACE --wait || true
              kubectl delete namespace $NAMESPACE --ignore-not-found=true
              echo "✅ Complete cleanup finished for failed fresh tenant $TENANT_ID."
            fi
        
        - name: Report Customer target_url
          if: success()
          run: |
            TENANT_ID="${{ github.event.client_payload.company_id || inputs.company_id }}"
            LOGIN_URL="https://$TENANT_ID.sas-product.com/login"
            echo "✅ Tenant $TENANT_ID successfully onboarded/updated!"
            echo "Customer Welcome & Login URL: $LOGIN_URL"