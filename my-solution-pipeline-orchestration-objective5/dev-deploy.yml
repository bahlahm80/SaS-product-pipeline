name: Dev CD Pipeline

on:
  push:
    branches: [ master ]

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR Image Tag to Deploy (e.g. Git Commit SHA or Release Tag)'
        required: true
        default: 'latest'

jobs:
  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: prep
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using deployment image tag: $TAG"

      - name: Build and Push Image to ECR (Dev)
        uses: ./.github/actions/build-artifact
        with:
          tag: ${{ steps.prep.outputs.tag }}

      - name: Apply Terraform / Helm for Dev
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          echo "Deploying infrastructure & application to Dev environment..."
          # terraform apply -var-file=environments/dev.tfvars -var="image_tag=${{ steps.prep.outputs.tag }}"
          
          # 2. Helm deploys the application container using the immutable image tag
          helm upgrade --install dev-app ./helm/app-template \
            --namespace dev \
            --create-namespace \
            --set image.tag="$TAG" \
            --timeout 5m

      - name: Run Post-Deploy Integration Tests
        uses: ./.github/actions/run-system-tests
        with:
          test_type: 'full' 
          target_url: 'https://dev.sas-product.internal'

      - name: Check Test Results & Gate Staging
        if: failure()
        run: |
          echo "ERROR: Dev integration tests failed! Flagging build."
          exit 1

      - name: Trigger Staging Deployment on System Test Success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_TAG="${{ steps.prep.outputs.tag }}"
          echo "Dev system tests passed! Automatically triggering Staging deployment for tag: $IMAGE_TAG..."
          
          gh workflow run staging-deploy.yml \
            --ref master \
            -f image_tag="$IMAGE_TAG" \
            -f auto_triggered="true"
