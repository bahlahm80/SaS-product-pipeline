name: Dev CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment to Deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging

jobs:
  deploy-dev:
    environment: dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Image to ECR (Dev)
        uses: ./.github/actions/build-artifact
        with:
          tag: ${{ github.sha }}

      - name: Apply Terraform / Helm for Dev
        run: |
          echo "Deploying infrastructure & application to Dev environment..."
          # terraform apply -var-file=environments/dev.tfvars

      - name: Run Post-Deploy Integration Tests
        uses: ./.github/actions/run-system-tests
        with:
          test_type: full 
          target_url: [https://dev.sas-product.internal]

      - name: Check Test Results & Gate Staging
        if: failure()
        run: |
          echo "ERROR: Dev integration tests failed! Flagging build."
          exit 1
