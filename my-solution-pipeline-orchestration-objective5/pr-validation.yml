name: PR Validation & Ephemeral Stack

on:
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: local
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build PR Docker Image
        uses: ./.github/actions/build-artifact
        with:
          tag: ${{ github.event.pull_request.head.sha }}

      - name: Spin up Local Dev Stack (Kind / Docker Compose)
        run: |
          echo "Setting up ephemeral PR stack for testing..."

      - name: Run Integration Tests
        uses: ./.github/actions/run-system-tests
        with:
          test_type: full 
          target_url: http://localhost:8080

      - name: Teardown Ephemeral Stack
        if: always()
        run: |
          echo "Cleaning up PR stack resources..."