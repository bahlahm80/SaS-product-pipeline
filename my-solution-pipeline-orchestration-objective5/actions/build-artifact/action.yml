name: 'Build Product Artifact'
description: 'Builds the SaS application artifact'
inputs:
  tag:
    description: 'Docker image tag'
    required: true
    default: 'latest'

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      shell: bash
      run: |
        echo "Building docker image with tag: ${{ inputs.tag }}"
        docker build -t sas-product:${{ inputs.tag }} .