name: Staging CD Pipeline

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR/Artifactory Image Tag to Deploy (e.g. Git Commit SHA or Release Tag)'
        required: true
        default: 'latest'

jobs:
  deploy-staging:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Authenticate with Staging AWS Account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::222222222222:role/GitHubActionsStagingRole

      - name: Pull and Push Artifact to Staging ECR
        uses: ./my-solution-pipeline-orchestration-objective5/.github/actions/pull-artifact
        with:
          tag: ${{ inputs.image_tag }}
          artifactory_url: 'artifactory.internal/sas-product'
          artifactory_user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory_token: ${{ secrets.ARTIFACTORY_TOKEN }}
          local_ecr_registry: '222222222222.dkr.ecr.us-east-1.amazonaws.com/sas-product-staging'
          aws_region: 'us-east-1'

      - name: Provision customer namespace/infrastructure with Terraform in Staging
        run: |
          cd my-solution-infrastructure-as-code-objective9/terraform/environments/staging
          terraform init
          terraform apply -auto-approve -target='module.customer["$TENANT_ID"]'

      - name: Deploy to Staging via Terraform/Helm
        run: |
          TAG="${{ inputs.image_tag }}"
          echo "Deploying image tag $TAG to Staging environment..."
          
          # Helm upgrade for staging
          helm upgrade --install staging-app ./my-solution-pipeline-orchestration-objective5/helm/tenant-template \
          --namespace staging \
          --create-namespace \
          --set companyName="Staging Test Company" \
          --set companyMotto="Staging environment" \
          --set host="staging.sas-product.internal" \
          --set image.tag="$TAG" \
          --timeout 5m


      - name: Run Staging Integration Tests
        uses: ./my-solution-pipeline-orchestration-objective5/.github/actions/run-system-tests
        with:
          test_type: 'smoke'
          target_url: 'https://staging.sas-product.internal'
            
      - name: Verify Staging Gate for Production
        if: failure()
        run: |
          RELEASE_NAME="staging-app"
          NAMESPACE="staging"

          echo "⚠️ Staging integration tests or deployment failed! Rolling back..."

          REVISION_COUNT=$(helm history $RELEASE_NAME -n $NAMESPACE --output json 2>/dev/null | jq '. | length' || echo 0)

          if [ "$REVISION_COUNT" -gt 1 ]; then
            echo "🔄 Rolling back Staging release to previous working revision..."
            helm rollback $RELEASE_NAME -n $NAMESPACE
          else
            echo "🧹 No previous revision found. Cleaning up failed deployment..."
            helm uninstall $RELEASE_NAME -n $NAMESPACE --wait || true
          fi
          
          exit 1
